default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: require-signed-commit
        name: Require signed commit (-s)
        language: system
        always_run: true
        pass_filenames: true
        stages: [commit-msg]
        entry: bash
        args:
          - -c
          - |
            if ! grep -qE '^Signed-off-by: .+' "$1"; then
              echo "ERROR: Commits must be signed. Use: git commit -s"
              echo "This adds a Signed-off-by line (DCO)."
              echo ""
              echo "To set up globally: git config --global format.signoff true"
              exit 1
            fi
          - --

      - id: no-push-to-main
        name: Block direct push to main
        entry: "bash -c 'branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null); if [ \"$branch\" = \"main\" ] || [ \"$branch\" = \"master\" ]; then echo \"ERROR: Do not commit directly to $branch.\"; echo \"Fork the repo, create a feature branch, and open a PR.\"; echo \"See CONTRIBUTING.md for details.\"; exit 1; fi'"
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: Run unit tests
        entry: python3 -m pytest -q
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
