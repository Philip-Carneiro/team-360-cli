name: Daily PRs Report → Slack

on:
  schedule:
    - cron: '0 6 * * 1-5'  # 06:00 UTC, Mon-Fri
  workflow_dispatch:        # trigger manual via UI

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create teams.json from secret
        env:
          TEAMS_JSON: ${{ secrets.TEAMS_JSON }}
        run: echo "$TEAMS_JSON" > teams.json

      - name: Generate PR report
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 team_prs.py --team green

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, re, sys, urllib.request
          from datetime import datetime, timezone

          files = sorted(glob.glob("Team-PRs-Report/**/*.md", recursive=True))
          if not files:
              print("No report found")
              sys.exit(1)
          report = open(files[-1]).read()

          match = re.search(r"```json\n(\[.*?\])\n```", report, re.DOTALL)
          if not match:
              print("Slack MSG JSON not found in report")
              sys.exit(1)
          items = json.loads(match.group(1))

          if not items:
              print("No PRs to post")
              sys.exit(0)

          # Plain URLs — Slack auto-links them even in Workflow Builder
          lines = []
          for item in items:
              pr_num = item['text'].split(' - ')[0]
              lines.append(f"• {item['text']}  [{item['age']}] — {item['author']}")
              lines.append(f"  ↳ {item['url']}")
          body = "\n".join(lines)

          date = datetime.now(timezone.utc).strftime("%d/%m/%Y")
          text = f":bar_chart: *PRs Status Today — {date}* ({len(items)} open)\n\n{body}"

          payload = json.dumps({"text": text}).encode()
          url = os.environ["SLACK_WEBHOOK_URL"]
          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req)
              print("Posted to Slack")
          except Exception as e:
              print(f"Slack post failed: {e}")
              sys.exit(1)
          PYEOF
